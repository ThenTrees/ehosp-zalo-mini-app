<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content:"
    />
    <!--
      KHÔNG khoá phóng to. Bản trước có `maximum-scale=1, user-scalable=no` —
      mẫu mặc định của template, chép theo thói quen "cho giống app".

      Đây là ứng dụng cho NGƯỜI BỆNH ở một phòng khám, trong đó phần đông là
      người nhiều tuổi đọc đơn thuốc và số thứ tự trên màn hình nhỏ. Khoá phóng
      to là lấy đi cách duy nhất họ có để đọc được, và WCAG 1.4.4 xếp nó vào
      mức A. Cái giá phải trả — người dùng lỡ phóng to khi chạm hai ngón — nhỏ
      hơn nhiều so với một người không đọc nổi liều thuốc của mình.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#007aff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Zalo Mini App</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- built script files will be auto injected -->

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
